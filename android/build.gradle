plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.cloudwalk.flightclub'
    compileSdk 34

    // the networking code is built on Apache HTTP, dropped from the
    // platform in Android 6
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        // not the Play Store id, so this installs alongside the real app
        applicationId 'com.cloudwalk.flightclub.source'
        minSdk 21
        targetSdk 28
        versionCode 51
        versionName '0.7.2-source'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['res']
            // shared with the web build - single source of truth
            assets.srcDirs = ['../assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':core')
}
