plugins {
    id 'java-library'
}

// Pin the compiler, so what this module produces does not depend on whichever
// JDK the developer happens to have as their default.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Java 8 bytecode: consumed by the Android app (minSdk 21) and by TeaVM.
    // `release` rather than source/targetCompatibility because it also checks
    // the API surface, which matters for a module that has to run on both.
    options.release = 8
    options.compilerArgs << '-Xlint:-options'
}

/**
 * The point of this module is that it does not depend on any platform. That is
 * easy to lose by accident - one stray `import android.util.Log` and the web
 * build stops compiling for reasons that surface a long way from the cause.
 * Fail the build at the source instead.
 */
def forbidden = ['android.', 'javax.microedition.']
tasks.register('checkPortable') {
    description = 'Fails if core has picked up a platform dependency.'
    def srcDir = file('src/main/java')
    inputs.dir srcDir
    outputs.upToDateWhen { false }
    doLast {
        def offences = []
        srcDir.eachFileRecurse { f ->
            if (f.name.endsWith('.java')) {
                f.eachLine { line, n ->
                    forbidden.each { bad ->
                        if (line ==~ /^\s*import\s+${java.util.regex.Pattern.quote(bad)}.*/) {
                            offences << "${f.path}:${n}: ${line.trim()}"
                        }
                    }
                }
            }
        }
        if (offences) {
            throw new GradleException(
                ":core must stay platform-independent, but found:\n  " + offences.join("\n  "))
        }
    }
}
tasks.named('check') { dependsOn 'checkPortable' }
